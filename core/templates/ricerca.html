{% load static %}
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocsLLM - Ricerca</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=2">
</head>
<body>
    <div class="layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand">
                    <span class="sidebar-brand-icon">✱</span>
                    <span class="sidebar-logo">DocsLLM</span>
                </div>
                <button class="sidebar-toggle" id="sidebarToggle" aria-label="Chiudi sidebar">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="9" y1="3" x2="9" y2="21"></line>
                    </svg>
                </button>
            </div>

            <div class="sidebar-search">
                <input type="text" id="sidebarSearchInput" placeholder="Cerca una commessa" class="sidebar-search-input">
                <button class="sidebar-search-toggle" id="searchIconButton" aria-label="Apri ricerca">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </div>

            <div class="sidebar-search-results" id="searchResults">
            </div>

            <nav class="sidebar-nav">
                <ul class="sidebar-links">
                </ul>
            </nav>

            <div class="sidebar-footer">
                <div class="sidebar-user-info">
                    <div class="sidebar-avatar">{{ user.username.0|upper }}</div>
                    <div class="sidebar-user">
                        <span class="sidebar-user-name">{{ user.username }}</span>
                        <span class="sidebar-user-plan">{{ user.profile.job_title|default:"—" }}</span>
                    </div>
                    <button class="sidebar-menu-btn" id="userMenuBtn" aria-label="Menu utente">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <circle cx="12" cy="5" r="1.5"></circle>
                            <circle cx="12" cy="12" r="1.5"></circle>
                            <circle cx="12" cy="19" r="1.5"></circle>
                        </svg>
                    </button>
                </div>
                <div class="sidebar-user-menu" id="userMenu" style="display: none;">
                    <button class="sidebar-user-menu-item" id="logoutBtn">Esci</button>
                </div>
            </div>
        </aside>

        <div class="container">
        <!-- Navigation -->
        <nav class="top-nav">
            <div class="nav-pills">
                <a href="/" class="nav-pill">Chiedi</a>
                <a href="/ricerca/" class="nav-pill active">Ricerca</a>
                <a href="/report/" class="nav-pill">Report</a>
                <a href="/cronologia/" class="nav-pill">Cronologia</a>
            </div>
        </nav>
        <!-- Main Content -->
        <main class="main ricerca-main">
            <div class="greeting-section">
                <span class="greeting-icon">✱</span>
                <h1 class="greeting-text" id="greeting">Benvenuto, {{ user.username }}</h1>
            </div>

            <section class="ricerca-search-section">
                <div class="chat-card ricerca-search-card">
                    <div class="chat-card-input">
                        <textarea
                            id="searchDocInput"
                            class="message-input"
                            placeholder="Cerca nei documenti..."
                            rows="1"
                        ></textarea>
                    </div>
                    <div class="chat-card-footer">
                        <div class="chat-controls-left">
                            <div class="agent-status" id="searchStoreStatus">
                                <div class="agent-inactive" style="display: flex;">
                                    <span class="agent-text">Scegli una commessa ed un notebook</span>
                                </div>
                                <div class="agent-loading" style="display: none;">
                                    <svg class="spinner-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <circle cx="12" cy="12" r="10" opacity="0.25"></circle>
                                        <path d="M12 2 A10 10 0 0 1 22 12" stroke-linecap="round"></path>
                                    </svg>
                                    <span class="agent-text">Ricerca in corso...</span>
                                </div>
                                <div class="agent-success" style="display: none;">
                                    <span class="agent-text">Store pronto</span>
                                </div>
                            </div>
                        </div>
                        <div class="chat-controls-right">
                            <button class="btn-send disabled" id="searchBtn" disabled title="Cerca">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <div class="ricerca-results" id="ricercaResults"></div>
        </main>
        </div>
    </div>

    <div id="jobModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalJobTitle">Dettagli Commessa</h2>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <div class="modal-body" id="modalDetails">
            </div>
        </div>
    </div>

    <script src="{% static 'js/app.js' %}"></script>
    <script src="{% static 'js/ricerca.js' %}"></script>
</body>
</html>
