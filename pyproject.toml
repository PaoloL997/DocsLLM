[tool.poetry]
name = "docslm"
version = "0.1.0"
description = ""
authors = ["Paolo Litta <plitta@brembanarolle.com>"]
readme = "README.md"
packages = [{ include = "docslm" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
django = ">=6.0.1,<7.0.0"
openpyxl = ">=3.1.5,<4.0.0"
pandas = ">=2.3.3,<3.0.0"
pyyaml = ">=6.0.3,<7.0.0"
graphrag = { git = "https://github.com/PaoloL997/graphrag.git", rev = "main" }
pypdf = "^3.14.0"
reportlab = "^4.0.0"
markdown = "^3.7"
duckling = {git = "https://github.com/PaoloL997/duckling.git", rev = "feat/docling-serve"}
djangorestframework = "^3.17.1"
djangorestframework-simplejwt = "^5.5.1"
django-cors-headers = "^4.9.0"

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu129"
priority = "supplemental"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
